spring.application.name=PetsUniverse
server.port=8081

# Base de datos: valores locales por defecto, sobrescribibles con variables de entorno (p. ej. en Railway)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/PetsUniverse?useUnicode=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA: respeta exactamente los nombres de tablas y columnas del script SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false
