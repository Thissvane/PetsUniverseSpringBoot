<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Disponibilidades')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Disponibilidades</h1>
    <a th:href="@{/disponibilidad/nuevo}" class="btn btn-pets"><i class="bi bi-plus-lg"></i> Nuevo</a>
  </div>

  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr><th>ID</th><th>Día de la semana (1-7)</th><th>Hora de inicio</th><th>Hora de fin</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${lista}">
          <td th:text="${o.idDisponibilidad}"></td>
          <td th:text="${o.diaSemana}"></td>
          <td th:text="${o.horaInicio}"></td>
          <td th:text="${o.horaFin}"></td>
          <td class="text-end">
            <a th:href="@{/disponibilidad/editar/{id}(id=${o.idDisponibilidad})}" class="btn btn-sm btn-outline-primary">Editar</a>
            <form th:action="@{/disponibilidad/eliminar/{id}(id=${o.idDisponibilidad})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Eliminar este registro?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
          <td colspan="5" class="text-center text-muted py-4">No hay registros.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
