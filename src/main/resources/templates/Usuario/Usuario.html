<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Usuarios</h1>
    <a th:href="@{/usuario/nuevo}" class="btn btn-pets"><i class="bi bi-plus-lg"></i> Nuevo</a>
  </div>

  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Fecha de nacimiento</th><th>Número de documento</th><th>Teléfono</th><th>Correo electrónico</th><th>Vencimiento de la clave</th><th>Autoriza tratamiento de datos</th><th>Activo</th><th>Tipo de documento</th><th>Tipo de usuario</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${lista}">
          <td th:text="${o.idUsuario}"></td>
          <td th:text="${o.nombre}"></td>
          <td th:text="${o.apellido}"></td>
          <td th:text="${o.fechaNacimiento}"></td>
          <td th:text="${o.numDocumento}"></td>
          <td th:text="${o.numTelefono}"></td>
          <td th:text="${o.email}"></td>
          <td th:text="${o.fechaVencimientoClave}"></td>
          <td><span class="badge" th:classappend="${o.autorizacionDatos} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${o.autorizacionDatos} ? 'Sí' : 'No'"></span></td>
          <td><span class="badge" th:classappend="${o.estado} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${o.estado} ? 'Sí' : 'No'"></span></td>
          <td th:text="${o.tipoDocumento.sigla}"></td>
          <td th:text="${o.tipoUsuario.nombreTipo}"></td>
          <td class="text-end">
            <a th:href="@{/usuario/editar/{id}(id=${o.idUsuario})}" class="btn btn-sm btn-outline-primary">Editar</a>
            <form th:action="@{/usuario/eliminar/{id}(id=${o.idUsuario})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Eliminar este registro?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
          <td colspan="13" class="text-center text-muted py-4">No hay registros.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
