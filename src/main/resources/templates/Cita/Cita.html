<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Citas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Citas</h1>
    <a th:href="@{/cita/nuevo}" class="btn btn-pets"><i class="bi bi-plus-lg"></i> Nuevo</a>
  </div>

  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr><th>ID</th><th>Fecha</th><th>Hora</th><th>Pago autorizado</th><th>Mascota</th><th>Servicio</th><th>Estado</th><th>Veterinario</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${lista}">
          <td th:text="${o.idCita}"></td>
          <td th:text="${o.fecha}"></td>
          <td th:text="${o.hora}"></td>
          <td><span class="badge" th:classappend="${o.statusAutorizacion} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${o.statusAutorizacion} ? 'Sí' : 'No'"></span></td>
          <td th:text="${o.mascota.nombre}"></td>
          <td th:text="${o.servicio.descripcion}"></td>
          <td th:text="${o.estadoCita.nombreEstado}"></td>
          <td th:text="${o.veterinario.usuario.nombre + ' ' + o.veterinario.usuario.apellido}"></td>
          <td class="text-end">
            <a th:href="@{/cita/editar/{id}(id=${o.idCita})}" class="btn btn-sm btn-outline-primary">Editar</a>
            <form th:action="@{/cita/eliminar/{id}(id=${o.idCita})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Eliminar este registro?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
          <td colspan="9" class="text-center text-muted py-4">No hay registros.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
