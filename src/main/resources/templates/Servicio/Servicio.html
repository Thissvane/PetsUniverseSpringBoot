<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servicios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Servicios</h1>
    <a th:href="@{/servicio/nuevo}" class="btn btn-pets"><i class="bi bi-plus-lg"></i> Nuevo</a>
  </div>

  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr><th>ID</th><th>Descripción</th><th>Precio (COP)</th><th>Duración estimada (min)</th><th>Activo</th><th>Tipo de servicio</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="o : ${lista}">
          <td th:text="${o.idServicio}"></td>
          <td th:text="${o.descripcion}"></td>
          <td th:text="${o.precio}"></td>
          <td th:text="${o.duracionEstimada}"></td>
          <td><span class="badge" th:classappend="${o.estado} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${o.estado} ? 'Sí' : 'No'"></span></td>
          <td th:text="${o.tipoServicio.descripcion}"></td>
          <td class="text-end">
            <a th:href="@{/servicio/editar/{id}(id=${o.idServicio})}" class="btn btn-sm btn-outline-primary">Editar</a>
            <form th:action="@{/servicio/eliminar/{id}(id=${o.idServicio})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Eliminar este registro?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(lista)}">
          <td colspan="7" class="text-center text-muted py-4">No hay registros.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
