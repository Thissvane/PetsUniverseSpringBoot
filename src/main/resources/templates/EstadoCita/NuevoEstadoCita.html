<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Estado de cita')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 720px;">
  <h1 class="h3 mb-3" th:text="${objeto.idEstadoCita == null} ? 'Nuevo registro: Estado de cita' : 'Editar registro: Estado de cita'"></h1>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/estado_cita/guardar}" th:object="${objeto}" method="post" class="bg-white p-4 rounded shadow-sm" novalidate>
    <input type="hidden" th:field="*{idEstadoCita}">
      <div class="mb-3">
        <label class="form-label" for="nombreEstado">Nombre del estado</label>
        <input type="text" class="form-control" th:field="*{nombreEstado}" th:errorclass="is-invalid" maxlength="40" required>
        <div class="invalid-feedback" th:errors="*{nombreEstado}"></div>
      </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-pets">Guardar</button>
      <a th:href="@{/estado_cita}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
